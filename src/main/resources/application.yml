spring:
  application:
    name: primarchs-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/primarchsdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:d2FyaGFtbWVyNDBrLXByaW1hcmNocy1hcGktZGV2LXNlY3JldC1rZXktMDEyMzQ1Njc4OWFiY2RlZg==}
      expiration-millis: ${JWT_EXPIRATION_MILLIS:86400000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
