services:
  db:
    image: postgres:16-alpine
    container_name: primarchs-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: primarchsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d primarchsdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: primarchs-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/primarchsdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-d2FyaGFtbWVyNDBrLXByaW1hcmNocy1hcGktZGV2LXNlY3JldC1rZXktMDEyMzQ1Njc4OWFiY2RlZg==}
    ports:
      - "8080:8080"

volumes:
  pgdata:
